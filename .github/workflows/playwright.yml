name: Playwright quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  tests:
    name: TypeScript + StreamFlix tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 30
    env:
      CI: 'true'
      STREAMFLIX_DIR: ${{ github.workspace }}/streamflix-app
    steps:
      - name: Checkout QE framework
        uses: actions/checkout@v4
        with:
          path: qe

      - name: Checkout pinned StreamFlix demo app
        uses: actions/checkout@v4
        with:
          repository: alokp0274/streamflix
          ref: 3d50dabe2c8ee4efd6a56ef0d2bfdc275fa2a42a
          path: streamflix-app
          persist-credentials: false

      # Temporary one-time bootstrap for the pinned upstream app's stale lockfile.
      - name: Generate and commit pinned StreamFlix lockfile
        working-directory: streamflix-app
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          mkdir -p ../qe/vendor
          cp package-lock.json ../qe/vendor/streamflix.package-lock.json
          cd ../qe
          git add vendor/streamflix.package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: pin reconciled StreamFlix upstream dependencies"
          git push origin HEAD:main

      - name: Install upstream application
        working-directory: streamflix-app
        run: |
          cp ../qe/vendor/streamflix.package-lock.json package-lock.json
          npm ci --no-audit --no-fund

      - name: Install QE framework
        working-directory: qe
        run: npm ci --no-audit --no-fund

      - name: Typecheck tests and config
        working-directory: qe
        run: npm run typecheck

      - name: Critical smoke on PRs and pushes
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        working-directory: qe
        run: npm run test:smoke

      - name: Cross-browser regression on schedule or manual trigger
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: qe
        run: npm run test:regression

      - name: Upload HTML report, JUnit and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            qe/playwright-report/
            qe/test-results/
          if-no-files-found: warn
          retention-days: 14
